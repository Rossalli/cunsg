<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Guia C.U.N.S.G.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Conceito: cabeçalho no cinza-carvão do logo, abas fixas e uma lista por vez.
   A cor forte fica só nas fitas e nas linhas; o resto é neutro. */
:root {
  --bg: #f2f1ee;
  --surface: #ffffff;
  --fg: #1f2023;
  --muted: #5b5d62;
  --line: #dcdad5;
  --ink: #3d3d3d;
  --on-ink: #ffffff;
  --on-ink-muted: #cfcfcf;
  --soft: #e9e7e1;
  --focus: #2f5fb3;
  --erro: #b3261e;
  --dotline: #b9b6ae;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1d1f; --surface: #28292c; --fg: #ececea; --muted: #a4a6aa;
    --line: #3a3b3f; --soft: #323336; --focus: #8fb4ff; --erro: #ff8a80; --dotline: #6c6d72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1d1f; --surface: #28292c; --fg: #ececea; --muted: #a4a6aa;
  --line: #3a3b3f; --soft: #323336; --focus: #8fb4ff; --erro: #ff8a80; --dotline: #6c6d72;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 1rem/1.55 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; line-height: 1.05; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.wrap { max-width: 44rem; margin-inline: auto; padding-inline: 16px; }

/* Cabeçalho */
.top { background: var(--ink); color: var(--on-ink); }
.top .wrap { display: flex; align-items: center; gap: 1.25rem; padding-block: 1.5rem; }
.logo { width: 6.5rem; height: 6.5rem; flex: none; color: var(--on-ink); }
.top h1 { font-size: clamp(2.4rem, 11vw, 3.6rem); letter-spacing: .02em; }
.top .sub { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .14em; font-size: 1rem; color: var(--on-ink-muted); margin-top: .25rem; }
.top .tag { color: var(--on-ink-muted); font-size: .95rem; margin-top: .5rem; max-width: 26rem; }

/* Abas */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs ul { list-style: none; margin: 0; padding: .6rem 16px; display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; max-width: 44rem; margin-inline: auto; }
.tabs ul::-webkit-scrollbar { display: none; }
.tabs a { display: block; white-space: nowrap; text-decoration: none; font-weight: 700; font-size: .95rem; padding: .5rem .9rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }

main.wrap { padding-block: 1.5rem 3rem; }
.view > * + * { margin-top: 1.5rem; }
.view h2 { font-size: 2.2rem; }
.lead { color: var(--muted); max-width: 38rem; }
.h3 { font-size: 1.4rem; }
.label { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: .95rem; color: var(--muted); }

/* Próxima gira */
.next { background: var(--ink); color: var(--on-ink); border-radius: 12px; padding: 1.25rem; display: grid; gap: .6rem; }
.next .label { color: var(--on-ink-muted); }
.next h3 { font-size: 2rem; }
.next .when { font-weight: 700; }
.next p { color: var(--on-ink); }
.next .chip { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.28); color: var(--on-ink); }

/* Atalhos */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: .75rem; }
.tile { display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .9rem 1rem; }
.tile b { display: block; font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; }
.tile span { color: var(--muted); font-size: .92rem; }

/* Listas */
.plain { list-style: none; margin: 0; padding: 0; }
.plain > li { padding-block: .85rem; border-top: 1px solid var(--line); }
.plain > li:last-child { border-bottom: 1px solid var(--line); }
.notice { background: var(--soft); border-radius: 10px; padding: .9rem 1rem; }
.notice b { font-weight: 700; }

/* Agenda */
.ag { display: grid; grid-template-columns: 3.6rem minmax(0, 1fr); gap: 1rem; }
.ag-d { text-align: center; }
.ag-d b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ag-d span { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: .2rem; }
.ag-b { min-width: 0; display: grid; gap: .3rem; }
.ag-b h3 { font-size: 1.35rem; }
.ag-b p { color: var(--muted); }
.ag.today .ag-d b { text-decoration: underline; text-underline-offset: 6px; }
.ag.sem .ag-d b, .ag.sem h3 { color: var(--muted); }
.badge { display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: .1rem .55rem; border-radius: 999px; border: 1px solid var(--dotline); vertical-align: 1px; }
.badge.fechada { background: #b3261e; border-color: #b3261e; color: #fff; }
.badge.aberta { background: transparent; color: var(--fg); }
.next .badge.aberta { color: var(--on-ink); border-color: rgba(255,255,255,.5); }
.month { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; text-transform: capitalize; margin-bottom: .6rem; }
.month-block + .month-block { margin-top: 1.5rem; }

/* Cores e fitas */
.sw { display: inline-block; width: 1rem; height: 1rem; border-radius: 50%; border: 1px solid var(--dotline); flex: none; vertical-align: -2px; }
.chip { display: inline-flex; align-items: center; gap: .4rem; font-size: .88rem; font-weight: 500; padding: .2rem .65rem .2rem .5rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.fita { display: grid; gap: .45rem; }
.fita h3 { font-size: 1.3rem; }
.fita p { color: var(--muted); font-size: .95rem; }
.dots { display: flex; gap: .25rem; flex-wrap: wrap; }

/* Linhas e saudações */
.saud { display: grid; grid-template-columns: 1.1rem minmax(0, 1fr); gap: .15rem .75rem; align-items: baseline; }
.saud .sw { grid-row: span 2; align-self: start; margin-top: .45rem; }
.saud .who { color: var(--muted); font-size: .92rem; }
.saud .say { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1.1; overflow-wrap: anywhere; }
.acc { border-top: 1px solid var(--line); }
.acc:last-of-type { border-bottom: 1px solid var(--line); }
.acc summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1.1rem minmax(0, 1fr) auto; gap: .75rem; align-items: center; padding-block: .85rem; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "+"; font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; color: var(--muted); line-height: 1; }
.acc[open] summary::after { content: "–"; }
.acc summary .t { min-width: 0; }
.acc summary .t b { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; display: block; line-height: 1.1; }
.acc summary .t span { color: var(--muted); font-size: .92rem; }
.acc .body { padding: 0 0 1rem 1.85rem; }
.acc dl { margin: 0; display: grid; grid-template-columns: minmax(6rem, 8rem) minmax(0, 1fr); gap: .35rem 1rem; }
.acc dt { color: var(--muted); font-size: .92rem; }
.acc dd { margin: 0; }

/* Datas */
.row2 { display: grid; gap: .35rem; }
.row2 h3 { font-size: 1.3rem; }
.row2 p { color: var(--muted); font-size: .95rem; }

/* Pix */
.pix { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; display: grid; gap: .6rem; }
.pix .key { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 1.05rem; overflow-wrap: anywhere; user-select: all; }
.pix .meta { color: var(--muted); font-size: .92rem; }
.btn { font: inherit; font-weight: 700; cursor: pointer; justify-self: start; padding: .5rem 1rem; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: var(--on-ink); }
.btn:disabled { opacity: .5; cursor: default; }

/* Firmezas */
.firm { list-style: none; margin: 0; padding: 0; counter-reset: f; }
.firm li { counter-increment: f; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: 0 .5rem; align-items: baseline; padding-block: .8rem; border-top: 1px solid var(--line); }
.firm li:last-child { border-bottom: 1px solid var(--line); }
.firm li::before { content: counter(f); font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
.firm b { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; line-height: 1.1; }
.firm .say { grid-column: 2; color: var(--muted); }

/* Pontos */
.p-head { display: grid; gap: .35rem; }
.back { justify-self: start; font-weight: 700; text-decoration: none; padding-block: .25rem; }
.back:hover { text-decoration: underline; }
.busca { display: grid; gap: .4rem; }
.busca input { width: 100%; font: inherit; font-size: 1rem; padding: .7rem .9rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
.busca input::placeholder { color: var(--muted); }
.psecs { display: grid; gap: 1.75rem; }
.psecs h3 { margin-bottom: .5rem; }
.pts { border-bottom: 1px solid var(--line); }
.pt { border-top: 1px solid var(--line); }
.pt summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .75rem; align-items: center; padding-block: .8rem; }
.pt summary::-webkit-details-marker { display: none; }
.pt summary::after { content: "+"; font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; color: var(--muted); line-height: 1; }
.pt[open] summary::after { content: "–"; }
.pt-t { min-width: 0; display: grid; gap: .1rem; font-weight: 500; overflow-wrap: anywhere; }
.pt[open] .pt-t { font-weight: 700; }
.pt-t small { color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.letra { display: grid; gap: .9rem; padding: 0 0 1.1rem; }
.letra p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }

/* Senha de acesso */
.gate { max-width: 44rem; margin-inline: auto; padding-inline: 16px; padding-block: 2rem 3rem; display: grid; gap: 1rem; }
.gate h2 { font-size: 2.2rem; }
.gate form { display: grid; gap: .8rem; max-width: 24rem; }
.gate input[type="password"] { width: 100%; font: inherit; font-size: 1rem; padding: .7rem .9rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
.gate .chk { display: flex; gap: .6rem; align-items: center; color: var(--muted); }
.gate .chk input { width: 1.1rem; height: 1.1rem; margin: 0; }
.gate .btn { padding: .7rem 1.4rem; }
.gate .erro { color: var(--erro); font-weight: 700; }

.foot { color: var(--muted); font-size: .88rem; padding-top: 1rem; }

@media (max-width: 420px) {
  .top .wrap { gap: 1rem; }
  .logo { width: 5rem; height: 5rem; }
  .acc dl { grid-template-columns: 1fr; gap: 0; }
  .acc dd { margin-bottom: .5rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .tile, .tabs a { transition: background-color .15s, border-color .15s; }
  .tile:hover { border-color: var(--muted); }
}
</style>

<div class="gate" id="gate">
  <h2>Acesso dos membros</h2>
  <p class="lead" id="gate-st">Digite a senha para abrir o guia.</p>
  <form id="gate-form">

    <input id="gate-pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    <label class="chk"><input id="gate-mem" type="checkbox" checked> Lembrar neste aparelho</label>
    <button class="btn" id="gate-btn" type="submit">Entrar</button>
    <p class="erro" id="gate-err" role="alert" hidden></p>
  </form>
</div>
